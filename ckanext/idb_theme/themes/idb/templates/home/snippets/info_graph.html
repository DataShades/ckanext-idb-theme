{% set info_graph = h.idb_theme_info_graph() %}

<ul class="home-hero-metrics list-unstyled">
    {% for metric in info_graph.metrics %}
        <li class="home-hero-metric">
            <span class="home-hero-metric-value">{{ metric.value }}{{ metric.suffix or '' }}</span>
            <a class="home-hero-metric-label" href="{{ metric.url }}">
                {{ metric.label }}
                {{ ui.icon("external-link", aria={"hidden": "true"}) }}
            </a>
        </li>
    {% endfor %}
</ul>
